name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Gallery incidents are valid
        run: pnpm breachmap validate gallery/incidents/*.json
      - name: Gallery maps are up to date
        run: |
          for file in gallery/incidents/*.json; do
            pnpm -s breachmap render "$file" -o "gallery/maps/$(basename "$file" .json).html"
          done
          git add -N gallery/maps
          git diff --exit-code gallery/maps
      - name: Bundled CLI runs
        run: node packages/cli/dist/cli.js validate fixtures/valid.json
